# Company registry: one entry per company. Adding or removing a company is a one-line change
# (or flip `enabled`). Each company appears once and keeps the first tier it matches.
#
# Fields
#   name, slug, tier (A|B|C), careersUrl (company's own careers homepage)
#   mode:    fetch | link-only        (link-only: shown on /companies with a direct link, no listings)
#   source:  greenhouse | lever | ashby | workday | oracle | amazon | apple | tiktok | amd | rippling | snap
#   board / host / tenant / site / siteNumber: source-specific identifiers
#   proofUrl: the company page that links to / embeds this exact board (source rule 4.1)
#   proof:   confirmed | pending      (pending = confirm by viewing the careers page in a browser)
#   logo:    path under /public/logos (monogram fallback if missing)
#   enabled: false removes the company everywhere
#   notes
#
# Source facts come from the Phase 0 discovery spike (docs/phase-0-discovery.md), 2026-11-14/15.

