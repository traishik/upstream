# Refreshes jobs every 6 hours, then builds and deploys to Cloudflare Pages.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Cadence: keep in sync with config/pipeline.yaml → cadence.
name: Refresh jobs
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit data/run-report.json (keeps the repo "active" so the schedule stays on)
  actions: write    # re-enable this workflow monthly as a belt-and-braces keep-alive

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Run pipeline
        id: pipeline
        env:
          SEED_FROM_SITE: https://upstreamjobs.pages.dev   # cold start: rebuild memory from the live site
        run: |
          set +e
          npm run pipeline
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: pipeline-state-${{ github.run_id }}
      - name: Build site
        if: steps.pipeline.outputs.code == '0'
        run: npm run build && npm run qa
      - name: Deploy to Cloudflare Pages
        if: steps.pipeline.outputs.code == '0'
        run: npx wrangler pages deploy dist --project-name upstreamjobs --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit run report
        if: always()
        run: |
          git config user.name "upstream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/run-report.json
          git commit -m "Run report $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no change"
          git push
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        run: gh workflow enable refresh.yml
        env: { GH_TOKEN: "${{ github.token }}" }
