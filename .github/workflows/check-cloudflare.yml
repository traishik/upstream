# Manual sanity check that the CLOUDFLARE_API_TOKEN secret can reach Pages and D1.
# Run it from the Actions tab ("Check Cloudflare access" → Run workflow) after rotating the token.
name: Check Cloudflare access
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Pages project reachable
        run: npx wrangler pages deployment list --project-name upstreamjobs | head -8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: D1 reachable
        run: npx wrangler d1 execute upstream --remote --command "SELECT COUNT(*) AS n FROM feedback"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
