# Lint/type-check, unit tests, build and static QA on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx tsc -p functions/tsconfig.json
      - run: npm run contrast
      - run: npm run build
      - run: npm run qa
